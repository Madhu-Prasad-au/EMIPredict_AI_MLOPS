# Default Render Blueprint: free/lite profile.
#
# Render auto-detects this root file when creating a Blueprint. You can also
# create a normal Web Service with:
#   runtime: docker
#   dockerfilePath: ./Dockerfile.free
#   plan: free
#   healthCheckPath: /_stcore/health
#   env EMI_PROFILE=lite
#
# The free instance is 0.1 CPU / 512 MB and sleeps after 15 minutes of
# inactivity. It runs the compact, leakage-free models, not the full 1.25 GB
# Random Forest.

services:
  - type: web
    name: emi-predict-ai-free
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.free
    healthCheckPath: /_stcore/health

    envVars:
      - key: EMI_PROFILE
        value: lite
      - key: EMI_ENV
        value: production
      - key: EMI_LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
